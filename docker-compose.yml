services:
  app:
    build:
      context: .
      args:
        # internal PyPI mirror for builds in the closed network; defaults to public PyPI
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "${APP_PORT:-8080}:8080"
    # .env (git-ignored, holds GIGACHAT_CREDENTIALS etc.) overrides docker.env
    env_file:
      - docker.env
      - .env
    environment:
      - APP_PORT=8080
    volumes:
      - app_tmp:/tmp
      - ./certs:/app/certs:ro

volumes:
  app_tmp:
