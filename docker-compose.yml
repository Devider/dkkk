services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    # .env (git-ignored, holds GIGACHAT_CREDENTIALS etc.) overrides docker.env
    env_file:
      - docker.env
      - .env
    environment:
      - APP_PORT=8080
      - V2_INDEX_DIR=/app/data/faiss
    volumes:
      - app_tmp:/tmp
      - app_faiss:/app/data/faiss
      - ./certs:/app/certs:ro

volumes:
  app_tmp:
  app_faiss:
