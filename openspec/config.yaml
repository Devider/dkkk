schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
context: |
  Tech stack: Python, LangGraph, LangChain, GigaChat, FastAPI, Excel, LibreOffice, UNO
  Don't commit anything yourself
  Domain: Financial modeling, credit inspection, cashflow analysis

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
operations:
  apply:
    guidance:
    - Use typing annotations for all functions and methods
    - Create methods with docstrings and type hints for all parameters and return values
    - Methods should be small and focused, with a single responsibility
    - Use ruff for linting and formatting
    - Check linting and formatting only for changed files, the old issue can be ignored
  archive:
    guidance:
      - Sync the master spec before archiving, create a new one if the suitable one doesn't exist
